<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ghost Tracks">
  <meta name="theme-color" content="#e4dccb">
  <title>Ghost Tracks</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=1">
  <link rel="stylesheet" href="/arcade-home.css?v=2">
  <script src="/persist-boot.js?v=4"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud">
    <div class="hud-bar">
      <a class="arcade-home" href="/">ALL GAMES</a>
      <div class="chip stage"><b>STAGE</b><span id="hud-stage">1</span></div>
      <div class="chip"><b>SPAN</b><span id="hud-span">0</span></div>
      <div class="chip"><b>TRIAL</b><span id="hud-trial">1 of 5</span></div>
      <div class="chip goal"><b>MISSES</b><span id="hud-goal">1 LEFT</span></div>
    </div>
  </div>
  <p class="prompt" id="prompt"></p>
  <div class="hud bottom">
    <button id="btn-pause" aria-label="Pause">II</button>
    <button id="btn-restart" class="wide" aria-label="New game">NEW</button>
    <button id="btn-mute" aria-label="Mute">♪</button>
  </div>

  <div class="overlay hidden" id="pause">
    <div class="card">
      <p class="kicker">ARKA</p>
      <h1>Paused</h1>
      <p class="hint" id="pause-stage">Stage 1</p>
      <button class="play" id="btn-resume">RESUME</button>
      <button class="ghost" id="btn-new">STAGES</button>
      <a class="ghost home-link" href="/">ALL GAMES</a>
    </div>
  </div>

  <div class="overlay hidden" id="done">
    <div class="card">
      <p class="kicker">ARKA</p>
      <h1 id="done-title">Round over</h1>
      <p class="hint" id="done-why"></p>
      <div class="stats">
        <div>Correct<strong id="done-home">0 / 5</strong></div>
        <div>Missed<strong id="done-miss">0</strong></div>
        <div>Span<strong id="done-span">0</strong></div>
        <div>Best<strong id="done-best">0</strong></div>
      </div>
      <button class="play" id="btn-again">PLAY AGAIN</button>
      <button class="ghost" id="btn-stages">STAGES</button>
      <a class="ghost home-link" href="/">ALL GAMES</a>
    </div>
  </div>

  <div class="overlay stages hidden" id="stages">
    <div class="stages-head">
      <a class="stages-home" href="/">ALL GAMES</a>
      <div>
        <p class="kicker">MY ARKADE</p>
        <h1>Stages</h1>
      </div>
      <button class="icon" id="btn-stages-close" aria-label="Close">×</button>
      <p class="stages-continue" id="stages-continue"></p>
    </div>
    <div class="stage-grid" id="stage-grid"></div>
  </div>

  <script type="module" src="./game.js?v=1"></script>
</body>
</html>
