<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARKA Arcade">
  <title>ARKA Arcade</title>
  <meta name="description" content="ARKA Arcade — Coffee Rush, Skyline Signal, Thought Tracks, and Infinite Tic Tac Toe.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/brand.css">
  <link rel="stylesheet" href="/launcher.css">
</head>
<body>
  <main class="page">
    <header class="mast">
      <p class="arka-kicker">ARKA</p>
      <h1>Arcade</h1>
      <p class="lede">Tap a game. Best scores stay here.</p>
    </header>
    <div class="resume-slot"></div>
    <section class="games" aria-label="Games"></section>
    <p class="arka-stamp">ARKA · 4 games</p>
  </main>
  <noscript>
    <p><a href="/coffee/">Coffee Rush</a> · <a href="/skyline/">Skyline Signal</a> · <a href="/tracks/">Thought Tracks</a> · <a href="/infinite/">Infinite Tic Tac Toe</a></p>
  </noscript>
  <script>
    (function () {
      var key = "arcade-bust-v5";
      if (!window.sessionStorage || sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, "1");
      var dirty = false;
      var jobs = [];
      if (navigator.serviceWorker) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (regs.length) dirty = true;
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        }));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (keys) {
          if (keys.length) dirty = true;
          return Promise.all(keys.map(function (name) { return caches.delete(name); }));
        }));
      }
      Promise.all(jobs).then(function () {
        if (dirty) location.reload();
      }).catch(function () {});
    })();
  </script>
  <script type="module" src="/launcher.js"></script>
</body>
</html>
