<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracks">
  <meta name="theme-color" content="#3a5c3a">
  <title>Thought Tracks</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="/arcade-home.css?v=2">
</head>
<body>
  <a class="arcade-home" href="/">ALL GAMES</a>
  <canvas id="game"></canvas>
  <div class="hud" id="hud">
    <div class="chip quiet"><b>TIME</b><span id="hud-time">0:34</span></div>
    <div class="chip"><b>CORRECT</b><span id="hud-correct">0 of 6</span></div>
  </div>
  <div class="hud bottom">
    <button id="btn-pause" aria-label="Pause">II</button>
    <button id="btn-restart" class="wide" aria-label="New game">NEW</button>
    <button id="btn-mute" aria-label="Mute">♪</button>
  </div>

  <div class="overlay hidden" id="pause">
    <div class="card">
      <h1>Paused</h1>
      <p class="hint">Switches stay as you left them.</p>
      <button class="play" id="btn-resume">RESUME</button>
      <button class="ghost" id="btn-new">STAGES</button>
      <a class="ghost home-link" href="/">ALL GAMES</a>
    </div>
  </div>

  <div class="overlay hidden" id="done">
    <div class="card">
      <h1 id="done-title">Round over</h1>
      <p class="hint" id="done-why"></p>
      <div class="stats">
        <div>Correct<strong id="done-home">0 / 6</strong></div>
        <div>Missed<strong id="done-miss">0</strong></div>
        <div>Score<strong id="done-score">0</strong></div>
        <div>Best<strong id="done-best">0</strong></div>
      </div>
      <button class="play" id="btn-again">PLAY AGAIN</button>
      <button class="ghost" id="btn-stages">STAGES</button>
      <a class="ghost home-link" href="/">ALL GAMES</a>
    </div>
  </div>

  <div class="overlay stages hidden" id="stages">
    <div class="stages-head">
      <div>
        <p class="kicker">ARKA</p>
        <h1>Stages</h1>
      </div>
      <button class="icon" id="btn-stages-close" aria-label="Close">×</button>
    </div>
    <p class="stages-continue" id="stages-continue"></p>
    <div class="stage-grid" id="stage-grid"></div>
  </div>

  <script type="module" src="./game.js?v=14"></script>
</body>
</html>
